<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form with Validation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Get in Touch</h1>
    <p class="subtitle">Fill in the form and we'll get back to you.</p>

    <form id="contact-form" novalidate>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma" autocomplete="name">
        <small class="error" id="name-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <small class="error" id="email-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel" inputmode="numeric">
        <small class="error" id="phone-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" maxlength="300" placeholder="Write your message here..."></textarea>
        <div class="row">
          <small class="error" id="message-error" aria-live="polite"></small>
          <small class="counter" id="counter">0 / 300</small>
        </div>
      </div>

      <button type="submit">Send Message</button>
    </form>

    <div class="success" id="success" role="status" hidden>
      <div class="tick">&#10003;</div>
      <h2>Thank you!</h2>
      <p>Your message has been submitted successfully.</p>
      <button type="button" id="again">Send another</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
